[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "euros-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "uvicorn>=0.35,<1", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[project.scripts]
euros-server = "euros_server.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
